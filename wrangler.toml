name = "proform-licensing"
main = "worker.js"
compatibility_date = "2024-09-01"

# Pin the account explicitly. Without this, `wrangler deploy` has to guess
# which Cloudflare account to deploy to whenever the API token / login has
# access to more than one account. In an unattended CI/build context
# (Cloudflare's Git integration build runner) an ambiguous account can
# cause the deploy to go to the wrong account silently, or fail, while your
# live custom domain keeps serving whatever was last deployed successfully
# — which looks exactly like "my new push isn't showing up."
account_id = "aedb296f351cfa538f7322c54c87b008"

# Non-secret config — safe to commit.
[vars]
ALLOWED_ORIGINS = "https://proforma-suite.com,https://www.proforma-suite.com"
# The Ed25519/ECDSA public key is not secret (it can only verify, never sign),
# but it's still set via `wrangler secret put` below alongside the rest so
# there's exactly one place all licensing config lives. If you'd rather keep
# it here in plain sight as a [vars] entry instead, that's fine too — just
# make sure it's the twin of the LICENSE_PRIVATE_KEY_JWK secret and of the
# key embedded in each app's HTML.

# Secrets — set these with `wrangler secret put NAME`, never commit them:
#   wrangler secret put UPSTASH_REDIS_REST_URL
#   wrangler secret put UPSTASH_REDIS_REST_TOKEN
#   wrangler secret put RESEND_API_KEY
#   wrangler secret put RESEND_FROM
#   wrangler secret put SUPPORT_TO_EMAIL
#   wrangler secret put STRIPE_SECRET_KEY
#   wrangler secret put STRIPE_WEBHOOK_SECRET
#
#   # One recurring monthly Price ID per subscription plan — see
#   # SETUP.md §4 for how to create these in the Stripe dashboard.
#   # Synthetix-CR is the DOCX Optimizer + ProForm Form Manager bundle
#   # plan, not a separate app.
#   wrangler secret put STRIPE_PRICE_ID_DOCX          # $4.99/mo
#   wrangler secret put STRIPE_PRICE_ID_PROFORM       # $10.99/mo
#   wrangler secret put STRIPE_PRICE_ID_SYNTHETIXCR   # $14.99/mo (bundle)
#   wrangler secret put STRIPE_PRICE_ID_PROREDACTOR   # $6.99/mo
#
#   wrangler secret put LICENSE_PRIVATE_KEY_JWK
#   wrangler secret put LICENSE_PUBLIC_KEY_JWK

# Route this worker at e.g. api.proforma-suite.com/* via the Cloudflare
# dashboard (Workers Routes) or uncomment and adjust:
# routes = [
#   { pattern = "api.proforma-suite.com/*", zone_name = "proforma-suite.com" }
# ]